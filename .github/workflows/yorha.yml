name: yorha

on:
  schedule:
    - cron: "*/30 * * * *" # redraw stats every 30 min
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: yorha
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: draw cards
        run: node scripts/generate.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          GH_USER: ${{ github.repository_owner }}
          LASTFM_USER: deathirs
          FEATURED_REPO: MusiKPL

      - name: draw contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#F2F2F2&color_dots=#161616,#3A3A3A,#6A6A6A,#A6A6A6,#E6E6E6
            dist/snake-light.svg?color_snake=#0A0A0A&color_dots=#EDEDED,#C4C4C4,#8C8C8C,#555555,#1A1A1A

      - name: publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: redraw unit data ◆"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
