="1.66" height="1.66" style="animation-delay:-8.05s;animation-duration:7.86s"/><rect class="pt" x="350.0" y="83.1" width="2.00" height="2.00" transform="rotate(45 350.0 83.1)" style="animation-delay:-8.19s;animation-duration:8.57s"/><rect class="pt" x="492.1" y="109.6" width="1.66" height="1.66" style="animation-delay:-0.78s;animation-duration:9.25s"/><rect class="pt" x="19.5" y="122.5" width="1.45" height="1.45" style="animation-delay:-5.08s;animation-duration:10.68s"/><rect class="pt" x="245.3" y="95.2" width="1.40" height="1.40" transform="rotate(45 245.3 95.2)" style="animation-delay:-4.10s;animation-duration:7.60s"/><rect class="pt" x="298.5" y="87.8" width="2.61" height="2.61" style="animation-delay:-6.64s;animation-duration:9.87s"/>
</g>
<path d="M29 28.5L33.5 33L29 37.5L24.5 33Z" fill="#F2F2F2"/>
<clipPath id="ta"><rect x="0" y="24" width="2000" height="5"/></clipPath>
