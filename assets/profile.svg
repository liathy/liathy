<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 545 400" width="545" height="400" role="img" aria-label="hi, i'm annie, a dev who codes best after dark. building MusiKPL, a cozy music player for Windows, Linux &amp; Android, written in Rust. it finds new music for you, makes auto mixes, hosts listening jams with friends &amp; scrobbles to Last.fm. currently exploring Angular, Tailwind &amp; Flutter. fun fact: my music player knows my taste better than i do">
<defs>
