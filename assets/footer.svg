<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 90" width="1200" height="90" aria-hidden="true">
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#AED6F1"/>
      <stop offset="1" stop-color="#D7BDE2"/>
    </linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3d7f"/>
      <stop offset="1" stop-color="#141029"/>
    </linearGradient>
    <clipPath id="r"><rect width="1200" height="90" rx="22"/></clipPath>
  </defs>
  <style>
    .w1{animation:wv 10s linear infinite}
    .w2{animation:wv 15s linear infinite reverse}
    @keyframes wv{from{transform:translateX(0)}to{transform:translateX(-600px)}}
    .s{fill:#fff;animation:tw 3s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
  </style>
  <g clip-path="url(#r)">
    <rect width="1200" height="90" fill="url(#b)"/>
    <circle class="s" cx="120" cy="70" r="1.4"/>
    <circle class="s" cx="380" cy="60" r="1.1" style="animation-delay:1s"/>
    <circle class="s" cx="640" cy="75" r="1.5" style="animation-delay:2s"/>
    <circle class="s" cx="900" cy="62" r="1.2" style="animation-delay:.5s"/>
    <circle class="s" cx="1110" cy="72" r="1.4" style="animation-delay:1.5s"/>
    <g class="w2" opacity=".55">
      <path fill="url(#a)" d="M0 30 Q150 54 300 30 T600 30 T900 30 T1200 30 T1500 30 T1800 30 V0 H0Z"/>
    </g>
    <g class="w1" opacity=".9">
      <path fill="url(#a)" d="M0 16 Q150 -6 300 16 T600 16 T900 16 T1200 16 T1500 16 T1800 16 V0 H0Z"/>
    </g>
  </g>
</svg>
