<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-label="a lilac cat sleeping on the moon">
  <defs>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#D7BDE2" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#AED6F1" stop-opacity=".18"/>
      <stop offset="1" stop-color="#AED6F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF6DD"/>
      <stop offset=".55" stop-color="#EBDDF7"/>
      <stop offset="1" stop-color="#C6E2F7"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8C78C9"/>
      <stop offset="1" stop-color="#6A57A8"/>
    </linearGradient>
    <mask id="cres">
      <circle cx="150" cy="150" r="96" fill="#fff"/>
      <circle cx="150" cy="104" r="92" fill="#000"/>
    </mask>
  </defs>
  <style>
    .bob{animation:bob 6s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    .breathe{transform-box:fill-box;transform-origin:50% 100%;animation:br 3.2s ease-in-out infinite}
    @keyframes br{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,1.07)}}
    .tail{transform-box:fill-box;transform-origin:0% 100%;animation:tl 4s ease-in-out infinite}
    @keyframes tl{0%,100%{transform:rotate(0)}50%{transform:rotate(-10deg)}}
    .ear{transform-box:fill-box;transform-origin:50% 100%;animation:ear 7s ease-in-out infinite}
    @keyframes ear{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-12deg)}96%{transform:rotate(4deg)}}
    .z{font:700 18px 'Segoe UI',Ubuntu,sans-serif;fill:#AED6F1;opacity:0;animation:z 4.5s ease-out infinite}
    @keyframes z{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(26px,-58px) scale(1.25)}}
    .tw{animation:tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes tw{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
    .glow{animation:gl 5s ease-in-out infinite}
    @keyframes gl{0%,100%{opacity:.75}50%{opacity:1}}
  </style>

  <!-- twinkly sparkles -->
  <path class="tw" fill="#D7BDE2" d="M48 60 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4z"/>
  <path class="tw" fill="#AED6F1" d="M250 48 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3z" style="animation-delay:1.1s"/>
  <path class="tw" fill="#E6D3F7" d="M262 190 l2.5 7 7 2.5 -7 2.5 -2.5 7 -2.5 -7 -7 -2.5 7 -2.5z" style="animation-delay:2s"/>
  <circle class="tw" cx="30" cy="190" r="2.5" fill="#AED6F1" style="animation-delay:.6s"/>
  <circle class="tw" cx="215" cy="28" r="2" fill="#E6D3F7" style="animation-delay:1.6s"/>
  <circle class="tw" cx="90" cy="30" r="1.8" fill="#fff" style="animation-delay:2.4s"/>

  <g class="bob">
    <circle class="glow" cx="150" cy="185" r="120" fill="url(#glow)"/>

    <!-- tail (behind body) -->
    <path class="tail" d="M196 196 C232 186 236 150 212 148" fill="none" stroke="url(#fur)" stroke-width="12" stroke-linecap="round"/>

    <!-- cat -->
    <g class="breathe">
      <ellipse cx="156" cy="196" rx="52" ry="27" fill="url(#fur)"/>
      <path d="M150 174 q6 8 0 16 M166 172 q6 9 0 18 M182 176 q5 8 0 15" fill="none" stroke="#5A4892" stroke-width="3" stroke-linecap="round" opacity=".55"/>
    </g>

    <!-- head -->
    <g>
      <g class="ear">
        <path d="M94 172 L97 142 L117 160Z" fill="#7C68BA"/>
        <path d="M100 166 L101 151 L111 160Z" fill="#F5B8DA"/>
      </g>
      <path d="M118 158 L134 140 L138 168Z" fill="#7C68BA"/>
      <path d="M124 158 L132 148 L134 163Z" fill="#F5B8DA"/>
      <circle cx="116" cy="183" r="27" fill="#8370C2"/>
      <!-- closed eyes -->
      <path d="M100 182 q6 5 12 0 M120 182 q6 5 12 0" fill="none" stroke="#2B2150" stroke-width="2.4" stroke-linecap="round"/>
      <!-- blush -->
      <ellipse cx="100" cy="192" rx="5.5" ry="3.5" fill="#F5B8DA" opacity=".75"/>
      <ellipse cx="133" cy="192" rx="5.5" ry="3.5" fill="#F5B8DA" opacity=".75"/>
      <!-- nose + mouth -->
      <path d="M113.5 189 h5 l-2.5 3z" fill="#F5B8DA"/>
      <path d="M116 192 q-3 4 -6 1 M116 192 q3 4 6 1" fill="none" stroke="#2B2150" stroke-width="1.6" stroke-linecap="round"/>
      <!-- whiskers -->
      <path d="M92 190 l-14 -2 M92 194 l-13 3 M140 190 l14 -2 M140 194 l13 3" stroke="#D7BDE2" stroke-width="1.3" stroke-linecap="round" opacity=".8"/>
    </g>
    <!-- paw -->
    <ellipse cx="140" cy="210" rx="11" ry="7" fill="#9886D2"/>

    <!-- moon (in front, cat tucked in its curve) -->
    <rect x="50" y="50" width="200" height="200" fill="url(#moon)" mask="url(#cres)"/>
    <circle cx="112" cy="232" r="5" fill="#E2D2F2" opacity=".8"/>
    <circle cx="180" cy="236" r="3.5" fill="#CFE3F5" opacity=".8"/>
    <circle cx="210" cy="222" r="2.6" fill="#E2D2F2" opacity=".8"/>
  </g>

  <!-- zzz -->
  <text class="z" x="138" y="140">z</text>
  <text class="z" x="138" y="140" style="animation-delay:1.5s;font-size:22px">z</text>
  <text class="z" x="138" y="140" style="animation-delay:3s;font-size:26px">Z</text>
</svg>
