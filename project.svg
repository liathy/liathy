<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 180" width="495" height="180" role="img" aria-label="MusiKPL project card">
<defs>
  <pattern id="p-hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#161616"/><rect width="2" height="5" fill="#F2F2F2"/></pattern>
  <pattern id="p-dots" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#161616"/><rect x="1" y="1" width="2" height="2" fill="#BDBDBD"/></pattern>
  <pattern id="p-cross" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#161616"/><path d="M0 0L6 6M6 0L0 6" stroke="#8C8C8C" stroke-width="1.2"/></pattern>
  <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".045"/></pattern>  <linearGradient id="ls" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#BDBDBD"/></linearGradient>
  <clipPath id="cardclip"><rect width="495" height="180"/></clipPath>
  
</defs>
<style>
  .pt{fill:#fff;opacity:0;animation:pt 9s linear infinite}
  @keyframes pt{0%{opacity:0;transform:translateY(0)}15%{opacity:.55}80%{opacity:.25}100%{opacity:0;transform:translateY(-40px)}}
  .title{font:600 13px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;letter-spacing:3.5px;fill:#F2F2F2}
  .lbl{font:500 13.5px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#8C8C8C}
  .val{font:700 14px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#F2F2F2}
  .small{font:500 12px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#8C8C8C}
  .caps{font:600 10.5px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;letter-spacing:2.5px;fill:#8C8C8C}
  .in{animation:in .7s ease-out both}
  @keyframes in{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
  .g1,.g2{opacity:0;animation:gl 8s steps(1) infinite}
  .g2{animation-delay:.08s}
  @keyframes gl{0%,91%{opacity:0;transform:none}92%{opacity:1;transform:translateX(4px)}93%{opacity:1;transform:translateX(-3px)}94%{opacity:0;transform:none}96%{opacity:.8;transform:translateX(2px)}97%,100%{opacity:0}}
  .base{animation:bf 8s steps(1) infinite}
  @keyframes bf{0%,91%{opacity:1}92%,93%{opacity:.35}94%,100%{opacity:1}}
.note{font:700 18px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#F2F2F2;animation:note 5s ease-in-out infinite;opacity:0}
      @keyframes note{0%{opacity:0;transform:translate(0,8px)}25%{opacity:.9}100%{opacity:0;transform:translate(14px,-30px)}}
      .bars{transform-box:fill-box;transform-origin:left;animation:grow 1.4s cubic-bezier(.2,.8,.2,1) .2s both}@keyframes grow{from{transform:scaleX(0)}}</style>
<g clip-path="url(#cardclip)">
  <rect width="495" height="180" fill="#0A0A0A"/>
  <rect class="pt" x="413.9" y="28.7" width="1.15" height="1.15" style="animation-delay:-5.73s;animation-duration:8.97s"/><rect class="pt" x="260.2" y="67.5" width="2.09" height="2.09" style="animation-delay:-2.49s;animation-duration:6.07s"/><rect class="pt" x="481.9" y="150.5" width="2.50" height="2.50" transform="rotate(45 481.9 150.5)" style="animation-delay:-3.74s;animation-duration:9.74s"/><rect class="pt" x="255.6" y="92.7" width="1.90" height="1.90" transform="rotate(45 255.6 92.7)" style="animation-delay:-8.43s;animation-duration:6.51s"/><rect class="pt" x="173.3" y="179.9" width="1.74" height="1.74" style="animation-delay:-3.92s;animation-duration:9.60s"/><rect class="pt" x="133.1" y="34.5" width="1.79" height="1.79" transform="rotate(45 133.1 34.5)" style="animation-delay:-3.22s;animation-duration:6.05s"/><rect class="pt" x="409.9" y="69.4" width="2.03" height="2.03" style="animation-delay:-0.36s;animation-duration:9.73s"/><rect class="pt" x="143.9" y="126.8" width="2.58" height="2.58" style="animation-delay:-4.44s;animation-duration:8.84s"/><rect class="pt" x="371.8" y="82.8" width="2.33" height="2.33" transform="rotate(45 371.8 82.8)" style="animation-delay:-5.89s;animation-duration:10.72s"/><rect class="pt" x="169.1" y="10.2" width="2.53" height="2.53" transform="rotate(45 169.1 10.2)" style="animation-delay:-1.86s;animation-duration:7.13s"/><rect class="pt" x="422.4" y="58.7" width="1.06" height="1.06" transform="rotate(45 422.4 58.7)" style="animation-delay:-8.69s;animation-duration:11.89s"/><rect class="pt" x="99.2" y="149.5" width="2.12" height="2.12" transform="rotate(45 99.2 149.5)" style="animation-delay:-5.72s;animation-duration:10.41s"/><rect class="pt" x="433.8" y="24.8" width="2.58" height="2.58" style="animation-delay:-4.59s;animation-duration:6.89s"/><rect class="pt" x="74.9" y="125.7" width="2.01" height="2.01" transform="rotate(45 74.9 125.7)" style="animation-delay:-1.71s;animation-duration:11.29s"/><rect class="pt" x="95.6" y="51.5" width="2.19" height="2.19" style="animation-delay:-7.05s;animation-duration:7.22s"/><rect class="pt" x="386.9" y="55.7" width="1.18" height="1.18" style="animation-delay:-8.48s;animation-duration:6.18s"/><rect class="pt" x="323.1" y="146.0" width="1.95" height="1.95" transform="rotate(45 323.1 146.0)" style="animation-delay:-6.32s;animation-duration:7.02s"/><rect class="pt" x="288.5" y="143.8" width="1.26" height="1.26" transform="rotate(45 288.5 143.8)" style="animation-delay:-4.09s;animation-duration:7.50s"/>
</g>


  <text class="caps" x="25" y="26" style="font-size:9.5px">◆ CURRENT MISSION</text>
  <text x="25" y="52" style="font:300 24px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;letter-spacing:2px;fill:#F2F2F2">MusiKPL</text>
  <rect x="133.5" y="35" width="54" height="20" fill="none" stroke="#8C8C8C"/><text class="small" x="140.5" y="49" textLength="40" style="fill:#F2F2F2">v3.6.2</text>
  <text class="note" x="420" y="52">♪</text>
  <text class="note" x="446" y="46" style="animation-delay:1.7s;fill:#BDBDBD">♫</text>
  <text class="note" x="400" y="42" style="animation-delay:3.3s;fill:#8C8C8C">♪</text>
  <text class="lbl in" x="25" y="80" style="animation-delay:0s">a lightweight music player for Windows, Linux &amp; Android, built</text><text class="lbl in" x="25" y="97" style="animation-delay:0.1s">with Rust. streams YouTube audio, makes auto mixes, hosts</text><text class="lbl in" x="25" y="114" style="animation-delay:0.2s">listening jams &amp; scrobbles to Last.fm</text>
  <rect x="25" y="128" width="445" height="8" fill="#161616"/><g class="bars"><rect x="25.0" y="128" width="383.5" height="8" fill="#F2F2F2"/><rect x="408.5" y="128" width="57.8" height="8" fill="url(#p-hatch)"/><rect x="466.3" y="128" width="3.7" height="8" fill="#8C8C8C"/></g>
  <rect x="25" y="128" width="445" height="8" fill="none" stroke="#3A3A3A" stroke-width=".8"/>
  <rect x="25" y="152" width="9" height="9" fill="#F2F2F2" stroke="#5A5A5A" stroke-width=".8"/><text class="small" x="39" y="161">Rust</text><rect x="77" y="152" width="9" height="9" fill="url(#p-hatch)" stroke="#5A5A5A" stroke-width=".8"/><text class="small" x="91" y="161">Kotlin</text><rect x="143" y="152" width="9" height="9" fill="#8C8C8C" stroke="#5A5A5A" stroke-width=".8"/><text class="small" x="157" y="161">PowerShell</text>
  <text class="small" x="470" y="161" text-anchor="end"><tspan style="fill:#F2F2F2">★</tspan> 0   <tspan style="fill:#F2F2F2">⑂</tspan> 0</text>
<g clip-path="url(#cardclip)" pointer-events="none"><rect width="495" height="180" fill="url(#scan)"/></g>
<rect x="0.5" y="0.5" width="494" height="179" fill="none" stroke="#3A3A3A"/>
<path d="M0.5 12.5V0.5H12.5M482.5 0.5H494.5V12.5M494.5 167.5V179.5H482.5M12.5 179.5H0.5V167.5" fill="none" stroke="#F2F2F2" stroke-width="1.5"/>
</svg>
